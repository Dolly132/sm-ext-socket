name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
        sourcemod-version: [master]
        libboost-version: [boost-1.82.0]
        python-version: ['3.10']
        include:
          - os: ubuntu-22.04
            compiler_cc: clang-14
            compiler_cxx: clang++-14

    steps:
      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          # Installed g++ (64-bit default) and g++-multilib if 32-bit fallback is still needed
          sudo apt install -yq --no-install-recommends g++ ${{ matrix.compiler_cc }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: extension

      - name: Checkout SourceMod ${{ matrix.sourcemod-version }}
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/sourcemod
          ref: ${{ matrix.sourcemod-version }}
          path: sourcemod
          submodules: recursive

      - name: Download libboost ${{ matrix.libboost-version }}
        run: |
          curl -L https://github.com/boostorg/boost/releases/download/${{ matrix.libboost-version }}/${{ matrix.libboost-version }}.tar.gz -o libboost.tar.gz
          tar -xvf libboost.tar.gz && rm libboost.tar.gz
          mv ${{ matrix.libboost-version }} libboost

      - name: Install AMBuild
        run: |
          python -m pip install wheel
          pip install git+https://github.com/alliedmodders/ambuild

      - name: Install sourcemod dependencies
        run: |
          bash sourcemod/tools/checkout-deps.sh -m -s ${{ matrix.sdks }}

      - name: Select clang compiler
        if: startsWith(runner.os, 'Linux')
        run: |
          echo "CC=${{ matrix.compiler_cc }}" >> $GITHUB_ENV
          echo "CXX=${{ matrix.compiler_cxx }}" >> $GITHUB_ENV
          ${{ matrix.compiler_cc }} --version
          ${{ matrix.compiler_cxx }} --version

      - name: Build libboost
        working-directory: libboost
        run: |
          ./bootstrap.sh --prefix=build --with-libraries=thread,system
          # Target 64-bit architecture
          ./b2 -j8 cflags=-m64 cxxflags=-m64 address-model=64 threading=multi architecture=x86 link=static runtime-link=static
          ./b2 install

      - name: Build
        working-directory: extension
        shell: bash
        env:
          BREAKPAD_SYMBOL_SERVER: ${{ secrets.BREAKPAD_SYMBOL_SERVER }}
        run: |
          mkdir build && cd build
          # Pass --enable-64 or target 64-bit architecture to your configure script
          python ../configure.py --enable-optimize --symbol-files --enable-64
          ambuild

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-x64
          path: extension/build/package

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Package
        run: |
          version=`echo $GITHUB_REF | sed "s/refs\/tags\///"`
          ls -Rall
          if [ -d "./Linux-x64/" ]; then
            cd ./Linux-x64/
            tar -czf ../${{ github.event.repository.name }}-${version}-linux-x64.tar.gz -T <(\ls -1)
            cd -
          fi
          if [ -d "./macOS-x64/" ]; then
            cd ./macOS-x64/
            tar -czf ../${{ github.event.repository.name }}-${version}-mac-x64.tar.gz -T <(\ls -1)
            cd -
          fi
          if [ -d "./Windows-x64/" ]; then
            cd ./Windows-x64/
            tar -czf ../${{ github.event.repository.name }}-${version}-windows-x64.tar.gz -T <(\ls -1)
            cd -
          fi

      - name: Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: '*.tar.gz'
          tag: ${{ github.ref }}
          file_glob: true
